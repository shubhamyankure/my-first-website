<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CircuitNest Projects</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

header{
  background:#111827;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#60a5fa;
}

nav button{
  margin-left:10px;
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn{
  background:#2563eb;
  color:white;
}

.signup-btn{
  background:#16a34a;
  color:white;
}

.hero{
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  color:#cbd5e1;
  max-width:700px;
  margin:auto;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card h2{
  margin-top:0;
}

.price{
  color:#fbbf24;
  font-size:22px;
  font-weight:bold;
}

.buy-btn{
  width:100%;
  padding:12px;
  background:#2563eb;
  border:none;
  border-radius:10px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-box{
  background:#1e293b;
  padding:25px;
  border-radius:15px;
  width:90%;
  max-width:400px;
}

.modal-box input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:8px;
}

.modal-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.close{
  margin-top:10px;
  background:#dc2626 !important;
}

#welcomeUser{
  text-align:center;
  margin-top:20px;
  color:#4ade80;
  font-size:20px;
}

</style>
</head>

<body>

<header>

<div class="logo">
CircuitNest
</div>

<nav>

<button class="login-btn" onclick="openLogin()">
Login
</button>

<button class="signup-btn" onclick="openSignup()">
Signup
</button>

</nav>

</header>

<div id="welcomeUser"></div>

<section class="hero">

<h1>Electronics Projects Store</h1>

<p>
Buy electronics projects with source code,
report, circuit diagram and support.
</p>

</section>

<section class="products">

<div class="card">

<img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80">

<div class="card-content">

<h2>IoT Health Monitoring</h2>

<div class="price">
₹6999
</div>

<button class="buy-btn"
onclick="buyProject('IoT Health Monitoring','₹6999')">
Buy Now
</button>

</div>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&w=1000&q=80">

<div class="card-content">

<h2>RFID Smart Parking</h2>

<div class="price">
₹5999
</div>

<button class="buy-btn"
onclick="buyProject('RFID Smart Parking','₹5999')">
Buy Now
</button>

</div>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1563770660941-10a63607668e?auto=format&fit=crop&w=1000&q=80">

<div class="card-content">

<h2>Voice Controlled Robot</h2>

<div class="price">
₹8999
</div>

<button class="buy-btn"
onclick="buyProject('Voice Controlled Robot','₹8999')">
Buy Now
</button>

</div>

</div>

</section>

<!-- LOGIN -->

<div class="modal" id="loginModal">

<div class="modal-box">

<h2>Login</h2>

<input type="email"
id="loginEmail"
placeholder="Email">

<input type="password"
id="loginPassword"
placeholder="Password">

<button onclick="login()">
Login
</button>

<button class="close"
onclick="closeModal('loginModal')">
Close
</button>

</div>

</div>

<!-- SIGNUP -->

<div class="modal" id="signupModal">

<div class="modal-box">

<h2>Create Account</h2>

<input type="text"
id="signupName"
placeholder="Full Name">

<input type="email"
id="signupEmail"
placeholder="Email">

<input type="password"
id="signupPassword"
placeholder="Password">

<button onclick="signup()">
Create Account
</button>

<button class="close"
onclick="closeModal('signupModal')">
Close
</button>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyA8LFD1u_eU5tkEmKdnAwfa7Alvz_auxUs",

  authDomain: "first-website-ae38a.firebaseapp.com",

  projectId: "first-website-ae38a",

  storageBucket: "first-website-ae38a.firebasestorage.app",

  messagingSenderId: "263459878392",

  appId: "1:263459878392:web:050584b3aafc0a4125520d",

  measurementId: "G-G1ZQYGXYMT"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.openSignup = function(){

  document.getElementById('signupModal').style.display='flex';

}

window.openLogin = function(){

  document.getElementById('loginModal').style.display='flex';

}

window.closeModal = function(id){

  document.getElementById(id).style.display='none';

}

window.signup = async function(){

  let name =
  document.getElementById('signupName').value;

  let email =
  document.getElementById('signupEmail').value;

  let password =
  document.getElementById('signupPassword').value;

  try{

    const userCredential =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await updateProfile(
      userCredential.user,
      {
        displayName:name
      }
    );

    alert("Account Created");

    closeModal('signupModal');

  }catch(error){

    alert(error.message);

  }

}

window.login = async function(){

  let email =
  document.getElementById('loginEmail').value;

  let password =
  document.getElementById('loginPassword').value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("Login Successful");

    closeModal('loginModal');

  }catch(error){

    alert(error.message);

  }

}

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById('welcomeUser').innerHTML =
    `Welcome ${user.displayName || user.email}`;

  }

});

window.buyProject = function(projectName, price){

  const user = auth.currentUser;

  if(!user){

    alert("Please Login First");

    openLogin();

    return;
  }

  const orderId = "CN" + Date.now();

  const phone = "918956919539";

  const message =
`Hello CircuitNest,

I want to order this project.

Project Name:
${projectName}

Price:
${price}

Order ID:
${orderId}

Customer Name:
${user.displayName || "User"}

Customer Email:
${user.email}`;

  const whatsappURL =
`https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

  window.open(whatsappURL, "_blank");

}

</script>

</body>
</html>
